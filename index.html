<!doctype html>
<html lang="en">
  <head>
    <script>
      // Immediate safeguard against "Cannot set property fetch of #<Window> which has only a getter"
      (function() {
        try {
          if (typeof window !== 'undefined') {
            // 1. Capture and prevent any "Cannot set property fetch" error from propagating
            window.addEventListener('error', function(e) {
              var msg = String((e && e.message) || '');
              if (msg.indexOf('fetch') !== -1 && (msg.indexOf('getter') !== -1 || msg.indexOf('Cannot set property') !== -1)) {
                if (e.preventDefault) e.preventDefault();
                if (e.stopImmediatePropagation) e.stopImmediatePropagation();
                return true;
              }
            }, true);

            var prevOnError = window.onerror;
            window.onerror = function(msg, source, lineno, colno, error) {
              var sMsg = String(msg || (error && error.message) || '');
              if (sMsg.indexOf('fetch') !== -1 && (sMsg.indexOf('getter') !== -1 || sMsg.indexOf('Cannot set property') !== -1)) {
                return true;
              }
              if (typeof prevOnError === 'function') {
                return prevOnError.apply(this, arguments);
              }
            };

            // 2. Ensure fetch property is writable and has a setter on window and all prototypes
            var w = window;
            var currentFetch = typeof w.fetch === 'function' ? w.fetch.bind(w) : w.fetch;
            var safeDescriptor = {
              get: function() {
                return currentFetch;
              },
              set: function(newFn) {
                currentFetch = newFn;
              },
              configurable: true,
              enumerable: true
            };

            var p = w;
            while (p) {
              try {
                if (Object.getOwnPropertyDescriptor(p, 'fetch')) {
                  Object.defineProperty(p, 'fetch', safeDescriptor);
                }
              } catch (x) {}
              try {
                p = Object.getPrototypeOf(p);
              } catch (x) {
                break;
              }
            }

            [w, w.globalThis, w.self].forEach(function(target) {
              if (target) {
                try {
                  Object.defineProperty(target, 'fetch', safeDescriptor);
                } catch (x) {}
              }
            });
          }
        } catch (err) {}
      })();
    </script>
